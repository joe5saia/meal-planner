services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Persist SQLite data in the mounted volume.
      DATABASE_URL: sqlite:////data/meal_planner.db
      # Optional: enables LLM ingredient normalization when set.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - meal_planner_data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        APP_PATH_PREFIX: ${APP_PATH_PREFIX:-/meals}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.meal-planner.rule=Host(`${APP_HOST:-meal.local}`) && (Path(`${APP_PATH_PREFIX:-/meals}`) || PathPrefix(`${APP_PATH_PREFIX:-/meals}/`))"
      - traefik.http.routers.meal-planner.entrypoints=web
      - traefik.http.routers.meal-planner.middlewares=meal-planner-strip
      - traefik.http.middlewares.meal-planner-strip.stripprefix.prefixes=${APP_PATH_PREFIX:-/meals}
      - traefik.http.services.meal-planner.loadbalancer.server.port=80

volumes:
  meal_planner_data:

networks:
  proxy:
    external: true
