[project]
name = "meal-planner-backend"
version = "0.1.0"
description = "Backend API for Meal Planner"
readme = "../README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "ingredient-parser-nlp>=0.1.0b2",
    "lxml>=5.1.0",
    "openai>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
    "ty>=0.0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "RET", "RUF"]
ignore = ["E501", "B008"]

[tool.uv]
package = false
