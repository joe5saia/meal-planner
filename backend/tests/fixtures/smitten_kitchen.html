    <meta property="og:image" content="https://smittenkitchen.com/wp-content/uploads/2023/crispy-smashed-potatoes.jpg">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Crispy Smashed Potatoes",
        "description": "The crispiest, most flavorful smashed potatoes you'll ever make. Boiled, smashed, and roasted until golden and irresistible.",
        "image": "https://smittenkitchen.com/wp-content/uploads/2023/crispy-smashed-potatoes.jpg",
        "author": {
            "@type": "Person",
            "name": "Deb Perelman"
        },
        "datePublished": "2023-03-10",
        "prepTime": "PT10M",
        "cookTime": "PT45M",
        "totalTime": "PT55M",
        "recipeYield": "4 servings",
        "recipeCategory": "Side Dish",
        "recipeCuisine": "American",
        "recipeIngredient": [
            "2 pounds small yellow or red potatoes",
            "Kosher salt",
            "4 tablespoons olive oil",
            "3 cloves garlic, minced",
            "2 tablespoons butter, melted",
            "1 teaspoon fresh rosemary, chopped",
            "1 teaspoon fresh thyme leaves",
            "1/2 teaspoon black pepper",
            "Flaky sea salt for finishing",
            "Fresh chives for garnish",
            "Sour cream for serving (optional)"
        ],
        "recipeInstructions": [
            {
                "@type": "HowToStep",
                "text": "Place potatoes in a large pot and cover with cold water. Add a generous amount of kosher salt. Bring to a boil, then reduce heat and simmer until potatoes are fork-tender, about 20-25 minutes."
            },
            {
                "@type": "HowToStep",
                "text": "Preheat oven to 450°F (230°C). Line a baking sheet with parchment paper and drizzle with 2 tablespoons olive oil."
            },
            {
                "@type": "HowToStep",
                "text": "Drain the potatoes and let them cool slightly. Place them on the prepared baking sheet, leaving space between each potato."
            },
            {
                "@type": "HowToStep",
                "text": "Using a fork or the bottom of a glass, gently press down on each potato to flatten it to about 1/2 inch thick. Some will break apart a bit - that's okay!"
            },
            {
                "@type": "HowToStep",
                "text": "Mix remaining olive oil with melted butter, garlic, rosemary, thyme, and pepper. Brush generously over each smashed potato."
            },
            {
                "@type": "HowToStep",
                "text": "Roast for 25-30 minutes, until edges are deeply golden and crispy."
            },
            {
                "@type": "HowToStep",
                "text": "Remove from oven and immediately sprinkle with flaky sea salt and fresh chives. Serve hot with sour cream if desired."
            }
        ],
        "nutrition": {
