    {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "One Pan White Wine Chicken Sausage White Bean Bake",

        "recipeYield": "6 servings",
        "recipeCategory": "Dinner",
        "recipeCuisine": "American",
        "recipeIngredient": [
            "2 tablespoons olive oil",
            "1 pound Italian chicken sausage, sliced",
            "1 medium yellow onion, diced",
            "4 cloves garlic, minced",
            "1 red bell pepper, diced",
            "1 zucchini, diced",
            "2 cans (15 oz each) cannellini beans, drained and rinsed",
            "1 cup cherry tomatoes, halved",
            "3/4 cup dry white wine",
            "1 cup chicken broth",
            "1 teaspoon dried oregano",
            "1 teaspoon dried basil",
            "1/2 teaspoon red pepper flakes",
            "1/2 teaspoon salt",
            "1/4 teaspoon black pepper",
            "1/4 cup fresh parsley, chopped",
            "1/4 cup parmesan cheese, grated",
            "Juice of 1 lemon",
            "Fresh basil for garnish"
        ],
        "recipeInstructions": [
            {
                "@type": "HowToStep",
                "text": "Preheat your oven to 400°F (200°C)."
            },
            {
                "@type": "HowToStep",
                "text": "Heat olive oil in a large oven-safe skillet over medium-high heat. Add the sliced chicken sausage and cook until browned on all sides, about 5 minutes. Remove and set aside."
            },
            {
                "@type": "HowToStep",
                "text": "In the same skillet, add the onion and cook until softened, about 3 minutes. Add the garlic and cook for 30 seconds until fragrant."
            },
            {
                "@type": "HowToStep",
                "text": "Add the bell pepper and zucchini, cooking for another 3-4 minutes until slightly softened."
            },
            {
                "@type": "HowToStep",
                "text": "Pour in the white wine and scrape up any browned bits from the bottom of the pan. Let it simmer for 2 minutes."
            },
            {
                "@type": "HowToStep",
                "text": "Add the chicken broth, beans, cherry tomatoes, oregano, basil, red pepper flakes, salt, and pepper. Stir to combine."
            },
            {
                "@type": "HowToStep",
                "text": "Return the sausage to the skillet and nestle it into the bean mixture."
            },
            {
                "@type": "HowToStep",
                "text": "Transfer the skillet to the oven and bake for 20-25 minutes until everything is heated through and slightly bubbly."
            },
            {
                "@type": "HowToStep",
                "text": "Remove from oven and drizzle with lemon juice. Top with fresh parsley, parmesan cheese, and fresh basil before serving."
            }
        ],
